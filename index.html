<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="src/assets/images/estrela.png" type="image/png">
    <link rel="stylesheet" href="src/style.css">
   
    <title>GameMafra</title>
</head>
<body>


    <section class="score-ui">
       <div>
            <span class="score">score: <span>0</span></span>
            <span class="level">level: <span>1</span></span>
            <span class="high">high: <span>0</span></span>
       </div> 
    </section>

    <section class="start-screen screen">
        <div>
            <h1>Project Mafra</h1>
            <button class="button-play">Play</button>
        </div>

        <span>Edu Mafra version</span>
    </section>

    <section class="game-over screen">
        <div>
            <h1>Game Over</h1>
            <button class="button-restart">Restart</button>
        </div>
    </section>

    <canvas></canvas>
    <script type="module" src="src/index.js"></script>
</body>
</html>
